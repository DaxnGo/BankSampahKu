name: Tugas dokumentasi
description: Catat perubahan atau penambahan dokumentasi
title: "docs: "
labels: ["docs"]
body:
  - type: textarea
    id: tujuan
    attributes:
      label: Tujuan dokumentasi
      description: Informasi apa yang perlu ditulis atau diperbarui?
    validations:
      required: true
  - type: textarea
    id: bagian
    attributes:
      label: Bagian atau berkas terkait
    validations:
      required: true
  - type: checkboxes
    id: selesai
    attributes:
      label: Kriteria selesai
      options:
        - label: Informasi benar, jelas, dan tidak mengarang data proyek.
        - label: Tautan dan nama berkas sudah diperiksa.
        - label: Dokumentasi sudah ditinjau anggota lain.
